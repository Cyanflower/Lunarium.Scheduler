name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '*.cs'
      - '*.csproj'
      - 'Interfaces/**'
      - 'Models/**'
  pull_request:
    paths:
      - '*.cs'
      - '*.csproj'
      - 'Interfaces/**'
      - 'Models/**'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build --configuration Release